[package]
name = "priorio-desktop"
version = "0.1.0"
description = "Priorio - Personal Task Management Desktop App"
authors = ["Priorio Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["shell-open", "window-all", "notification-all", "dialog-all", "fs-all", "process-all"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
keyring = "2.0"
notify-rust = "4.10"
reqwest = { version = "0.11", features = ["json"] }

[profile.release]
panic = "crash"
codegen-units = 1
lto = true
